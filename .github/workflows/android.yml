name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed if the repo holds the project as a .zip instead of loose files.
      # Skipped automatically when settings.gradle.kts is already at the repo root.
      - name: Extract project zip (if needed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project already at repo root, skipping extraction."
            exit 0
          fi
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "::error::No settings.gradle(.kts) and no ZIP file found."
            exit 1
          fi
          echo "Extracting ${ZIP_FILE}"
          unzip -q -o "${ZIP_FILE}" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The project has no gradlew, so install the Gradle version it asks for.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # build.gradle.kts expects ./debug.keystore for the debug signing config.
      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in the repository."
            echo "Please check that your project ZIP was uploaded."
            exit 1
          fi
          echo "Found project archive: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          cp -R source/. .
          rm -rf source

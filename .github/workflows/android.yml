- name: Extract Android project
  shell: bash
  run: |
    set -euo pipefail

    ZIP_FILE="$(find . -type f -iname '*.zip' \
                  -not -path './.git/*' \
                  -not -path './source/*' \
                  -not -path '*/node_modules/*' \
                  -not -path '*/build/*' \
                  -print -quit)"
    if [ -z "${ZIP_FILE}" ]; then
      echo "::error::No ZIP file found. Upload your project archive."
      exit 1
    fi
    echo "Found project archive: ${ZIP_FILE}"

    command -v unzip >/dev/null || { echo "Installing unzip"; sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }

    TMP_DIR="$(mktemp -d)"
    unzip -q -o "${ZIP_FILE}" -d "${TMP_DIR}"

    # Flatten a single top-level directory if present
    mapfile -t ENTRIES < <(find "${TMP_DIR}" -mindepth 1 -maxdepth 1)
    SRC="${TMP_DIR}"
    if [ "${#ENTRIES[@]}" -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
      SRC="${ENTRIES[0]}"
      echo "Flattening top-level directory: $(basename "${SRC}")"
    fi

    cp -a "${SRC}"/. .
    rm -rf "${TMP_DIR}"

    # Sanity check
    if [ ! -f ./settings.gradle ] && [ ! -f ./settings.gradle.kts ]; then
      echo "::warning::No settings.gradle(.kts) at repo root — Gradle commands may fail."
    fi
